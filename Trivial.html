    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic.css">
    
    <style>
        body {
            font-family: 'OpenDyslexic', sans-serif;
            background-color: #fcf9f2;
            -webkit-user-select: none;
            user-select: none;
            color: #1e293b;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .animate-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Color de botones de audio: rgb(170, 0, 77) */
        .audio-btn {
            background-color: rgb(170, 0, 77);
            color: white;
            transition: all 0.2s ease;
        }
        
        .audio-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .feedback-correct {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
            color: #166534 !important;
        }

        .feedback-wrong {
            border-color: #f1f5f9 !important;
            opacity: 0.3;
            filter: grayscale(0.8);
        }

        /* Ajuste de pantalla para evitar barras de desplazamiento */
        .game-card {
            max-height: 78vh;
            display: flex;
            flex-direction: column;
        }

        .options-grid {
            overflow-y: auto;
            max-height: 38vh;
        }

        .cat-btn {
            min-height: 100px;
        }
    </style>
</head>

            };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) {
                view.setInt16(offset, pcmData[i], true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        };

        // --- STREAMING_CHUNK:Implementing Gemini TTS integration... ---
        async function speak(text) {
            if (!text || state.isSpeaking) return;
            state.isSpeaking = true;
            render(); 

            try {
                let retries = 0;
                let response;
                while (retries < 3) {
                    try {
                        response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Dilo con acento de España, claro y amable: ${text}` }] }],
                                generationConfig: {
                                    responseModalities: ["AUDIO"],
                                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                                }
                            })
                        });
                        if (response.ok) break;
                    } catch (e) {
                        await new Promise(r => setTimeout(r, 1000));
                        retries++;
                    }
                }

                if (response?.ok) {
                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData;
                    if (part) {
                        const binary = atob(part.data);
                        const rate = parseInt(part.mimeType.match(/rate=(\d+)/)?.[1] || "24000");
                        const pcm = new Int16Array(binary.length / 2);
                        for (let i = 0; i < pcm.length; i++) {
                            pcm[i] = (binary.charCodeAt(i * 2) & 0xFF) | (binary.charCodeAt(i * 2 + 1) << 8);
                        }
                        const wav = pcmToWav(pcm, rate);
                        const audio = new Audio(URL.createObjectURL(wav));
                        audio.onended = () => { state.isSpeaking = false; render(); };
                        audio.play().catch(() => { state.isSpeaking = false; render(); });
                    } else { state.isSpeaking = false; render(); }
                } else { state.isSpeaking = false; render(); }
            } catch (e) {
                state.isSpeaking = false;
                render();
            }
        }

        // --- STREAMING_CHUNK:Rendering interfaces... ---
        function render() {
            const container = document.getElementById('app');
            document.getElementById('score-counter').textContent = state.score;
            container.innerHTML = '';

            // 1. Selector de Curso
            if (state.view === 'level-selection') {
                container.innerHTML = `
                    <div class="w-full animate-in flex flex-col items-center">
                        <h2 class="text-2xl md:text-3xl font-bold text-slate-700 mb-6 bg-white/60 px-6 py-2 rounded-2xl border border-slate-200">
                            ¿En qué curso estás?
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-md">
                            <button onclick="handleSelectLevel('grado2')" 
                                class="bg-sky-500 text-white p-6 rounded-3xl shadow-md transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center gap-2 border-b-[6px] border-sky-700">
                                <div class="text-6xl">🎒</div>
                                <span class="text-2xl font-bold">2º de Primaria</span>
                            </button>
                            <button onclick="handleSelectLevel('grado3')" 
                                class="bg-indigo-600 text-white p-6 rounded-3xl shadow-md transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center gap-2 border-b-[6px] border-indigo-800">
                                <div class="text-6xl">✏️</div>
                                <span class="text-2xl font-bold">3º de Primaria</span>
                            </button>
                        </div>
                    </div>
                `;
            } 
            // 2. Menú de Categorías (Pantalla Inicial tras elegir curso)
            else if (state.view === 'menu') {
                const levelName = state.level === 'grado2' ? '2º de Primaria' : '3º de Primaria';
                container.innerHTML = `
                    <div class="w-full animate-in flex flex-col items-center">
                        <div class="w-full flex justify-between items-center mb-3">
                            <button onclick="changeView('level-selection')" class="flex items-center gap-1 text-indigo-700 font-bold text-sm">
                                <i data-lucide="arrow-left" class="w-4 h-4"></i> Cambiar curso
                            </button>
                            <span class="text-xs font-bold text-indigo-800 bg-white border border-indigo-200 px-3 py-1 rounded-full">${levelName}</span>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-2 w-full">
                            ${categories.map(cat => {
                                const rem = getRemaining(cat.id);
                                const done = rem === 0;
                                return `
                                    <button onclick="handleSelectCat('${cat.id}')" ${done ? 'disabled' : ''}
                                        class="${cat.color} text-white p-3 rounded-2xl shadow-md transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center gap-1 cat-btn justify-center border-b-[5px] border-black/20 disabled:opacity-40">
                                        ${done ? '<i data-lucide="check-circle" class="w-7 h-7"></i>' : `<div class="text-3xl mb-1">${cat.icon}</div>`}
                                        <span class="font-bold text-lg leading-tight">${cat.name}</span>
                                        <span class="text-[10px] bg-black/10 px-2 py-0.5 rounded-full font-sans">Restan: ${rem}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } 
            // 3. Selección de Dificultad
            else if (state.view === 'difficulty') {
                const cat = categories.find(c => c.id === state.selectedCategory);
                container.innerHTML = `
                    <div class="flex flex-col gap-3 w-full animate-in items-center">
                        <button onclick="changeView('menu')" class="self-start flex items-center gap-1 text-indigo-700 font-bold text-base">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al menú
                        </button>
                        <h2 class="text-2xl font-bold text-slate-700 flex items-center gap-2">
                            ${cat.icon} ${cat.name}
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-sm">
                            <button onclick="handleSelectDiff('facil')" class="bg-green-500 text-white p-6 rounded-3xl shadow-lg flex flex-col items-center gap-2 active:translate-y-1 transition-all">
                                <div class="text-5xl">😊</div>
                                <span class="text-xl font-bold">Nivel Fácil</span>
                                <span class="text-[10px] bg-black/20 px-3 py-0.5 rounded-full">${getRemainingLevel(cat.id, 'facil')} por jugar</span>
                            </button>
                            <button onclick="handleSelectDiff('dificil')" class="bg-orange-500 text-white p-6 rounded-3xl shadow-lg flex flex-col items-center gap-2 active:translate-y-1 transition-all">
                                <div class="text-5xl">💪</div>
                                <span class="text-xl font-bold">Nivel Difícil</span>
                                <span class="text-[10px] bg-black/20 px-3 py-0.5 rounded-full">${getRemainingLevel(cat.id, 'dificil')} por jugar</span>
                            </button>
                        </div>
                    </div>
                `;
            } 
            // 4. Pregunta actual
            else if (state.view === 'question') {
                const cat = categories.find(c => c.id === state.selectedCategory);
                const q = state.currentQuestion;
                container.innerHTML = `
                    <div class="w-full bg-white rounded-3xl shadow-lg overflow-hidden border border-slate-100 animate-in game-card">
                        <div class="${cat.color} p-3 flex justify-between items-center text-white border-b-4 border-black/10">
                            <div class="flex items-center gap-2">
                                <span class="text-2xl">${cat.icon}</span>
                                <div class="flex flex-col text-left leading-tight">
                                    <span class="font-bold uppercase tracking-widest text-[10px]">${cat.name}</span>
                                    <span class="text-[10px] opacity-80 font-bold">${state.difficulty === 'facil' ? 'Fácil' : 'Difícil'}</span>
                                </div>
                            </div>
                            <button onclick="speak('${q.text.replace(/'/g, "\\'")}')" class="audio-btn p-2 rounded-full shadow ${state.isSpeaking ? 'animate-pulse' : ''}" ${state.isSpeaking ? 'disabled' : ''}>
                                <i data-lucide="volume-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="p-4 flex-1 flex flex-col">
                            <h2 class="text-xl md:text-2xl font-bold text-center leading-tight text-slate-800 mb-4">${q.text}</h2>
                            <div class="options-grid space-y-2 px-1">
                                ${q.options.map((opt, i) => `
                                    <div class="flex gap-2 items-stretch">
                                        <button onclick="handleAnswer(${i})" ${state.feedback !== null ? 'disabled' : ''}
                                            class="flex-1 p-3 rounded-xl text-left text-lg font-bold border-2 transition-all flex justify-between items-center
                                            ${state.feedback === null ? 'border-slate-100 bg-slate-50 active:bg-slate-100' : 
                                              i === q.correct ? 'feedback-correct' : (state.feedback === 'wrong' && i !== q.correct ? 'feedback-wrong' : 'border-slate-100')}">
                                            <span>${opt}</span>
                                            ${state.feedback !== null && i === q.correct ? '<i data-lucide="star" class="text-yellow-500 fill-yellow-500 w-5 h-5"></i>' : ''}
                                        </button>
                                        <button onclick="speak('${opt.replace(/'/g, "\\'")}')" class="audio-btn px-3 rounded-lg flex items-center justify-center shrink-0 ${state.isSpeaking || state.feedback !== null ? 'opacity-50' : ''}" ${state.isSpeaking || state.feedback !== null ? 'disabled' : ''}>
                                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                            ${state.feedback ? `
                                <div class="mt-4 flex flex-col items-center gap-2 animate-in">
                                    <div class="text-xl font-bold ${state.feedback === 'correct' ? 'text-green-600' : 'text-orange-500'}">
                                        ${state.feedback === 'correct' ? '¡Genial! 🎉' : '¡Casi! ✨'}
                                    </div>
                                    <!-- Botón Siguiente que lleva a la pantalla inicial de categorías -->
                                    <button onclick="changeView('menu')" class="bg-indigo-800 text-white px-8 py-2 rounded-full text-lg font-bold shadow-lg flex items-center gap-2 transform active:scale-95 transition-all">
                                        Elegir materia <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // --- STREAMING_CHUNK:Implementing school logic systems... ---
        function getRemainingLevel(catId, diff) { 
            if (!state.level) return 0;
            return questionsDB[state.level][catId][diff].filter(q => !state.completedIds.includes(q.id)).length; 
        }

        function getRemaining(catId) { 
            return getRemainingLevel(catId, 'facil') + getRemainingLevel(catId, 'dificil'); 
        }

        function handleSelectLevel(lv) {
            state.level = lv;
            state.view = 'menu';
            const courseName = lv === 'grado2' ? 'segundo' : 'tercero';
            speak(`Has elegido ${courseName} de primaria. ¡Elige una asignatura!`);
            render();
        }

        function handleSelectCat(id) { 
            state.selectedCategory = id; 
            state.view = 'difficulty'; 
            const cat = categories.find(c => c.id === id); 
            speak(`Has elegido ${cat.name}.`); 
            render(); 
        }

        function handleSelectDiff(diff) {
            const list = questionsDB[state.level][state.selectedCategory][diff].filter(q => !state.completedIds.includes(q.id));
            if (list.length === 0) { 
                speak("¡Has completado este nivel!"); 
                return; 
            }
            state.difficulty = diff;
            state.currentQuestion = list[Math.floor(Math.random() * list.length)];
            state.view = 'question';
            state.feedback = null;
            render();
            setTimeout(() => speak(state.currentQuestion.text), 300);
        }

        function handleAnswer(idx) {
            if (state.feedback) return;
            if (idx === state.currentQuestion.correct) {
                state.feedback = 'correct'; 
                state.score++; 
                state.completedIds.push(state.currentQuestion.id);
                localStorage.setItem('virgen_sierra_trivial', JSON.stringify(state.completedIds));
                speak("¡Excelente respuesta!");
            } else { 
                state.feedback = 'wrong'; 
                speak("¡Vaya! No pasa nada, inténtalo la próxima vez."); 
            }
            render();
        }

        function changeView(v) { 
            state.view = v; 
            state.feedback = null; 
            render(); 
        }

        function toggleResetModal(s) { 
            const m = document.getElementById('modal-reset');
            m.classList.toggle('hidden', !s); 
            if(s) { 
                m.classList.add('flex'); 
                document.getElementById('pass-input').focus(); 
            } else {
                m.classList.remove('flex');
            }
        }

        function confirmReset() {
            if (document.getElementById('pass-input').value === "Lucía") {
                state.score = 0; 
                state.completedIds = []; 
                state.view = 'level-selection';
                state.level = null;
                localStorage.removeItem('virgen_sierra_trivial'); 
                toggleResetModal(false);
                document.getElementById('pass-input').value = ''; 
                speak("El progreso se ha borrado correctamente."); 
                render();
            } else { 
                document.getElementById('pass-error').classList.remove('hidden'); 
                setTimeout(() => document.getElementById('pass-error').classList.add('hidden'), 2000); 
            }
        }

        // --- Start on Window Load ---
        window.onload = () => { 
            render(); 
            speak("Bienvenido al Trivial del Colegio Virgen de la Sierra."); 
        };
    </script>
</body>
</html>
